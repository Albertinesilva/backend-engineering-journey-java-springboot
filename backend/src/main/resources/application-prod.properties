# =====================================================
# PERFIL DE PRODUÇÃO
# =====================================================
# Segredos, credenciais e URLs são lidos de variáveis de ambiente
# SEM valor padrão (fail fast): se alguma faltar, a aplicação não sobe.
# Nenhum valor real deve ser escrito neste arquivo.

# =====================================================
# DATABASE CONFIGURATION (POSTGRESQL)
# =====================================================
# Banco obrigatório: sem estas propriedades o Spring Boot criaria
# um H2 em memória (H2 está no classpath) e os dados sumiriam a cada reinício.
spring.datasource.url=${POSTGRES_DATASOURCE_URL}
spring.datasource.username=${POSTGRES_DATASOURCE_USER}
spring.datasource.password=${POSTGRES_DATASOURCE_PASSWORD}

# Tamanho máximo do pool de conexões (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# =====================================================
# H2 CONSOLE
# =====================================================
# Garante que o console web do H2 nunca seja exposto em produção
spring.h2.console.enabled=false

# =====================================================
# JPA / HIBERNATE
# =====================================================
# Schema controlado pelo Flyway; o Hibernate apenas valida
# se as entidades correspondem às tabelas existentes
spring.jpa.hibernate.ddl-auto=validate

# SQL não é exibido no console em produção
spring.jpa.show-sql=false

# =====================================================
# DATABASE MIGRATION (FLYWAY)
# =====================================================
spring.flyway.enabled=true

# Somente estrutura: os dados de exemplo da pasta data
# (usuários com senha conhecida) NÃO vão para produção
spring.flyway.locations=classpath:db/migration/schema

# =====================================================
# SECURITY / OAUTH2
# =====================================================
# Sobrescreve os valores padrão de desenvolvimento do application.properties
security.client-id=${CLIENT_ID}
security.client-secret=${CLIENT_SECRET}

# =====================================================
# CORS / URLS
# =====================================================
cors.origins=${CORS_ORIGINS}
backend.url=${BACKEND_URL}
frontend.url=${FRONTEND_URL}

# =====================================================
# JAVAMAIL
# =====================================================
# Credenciais do SMTP obrigatórias (host e porta herdam do application.properties)
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# =====================================================
# API DOCUMENTATION (SPRINGDOC / OPENAPI)
# =====================================================
# Documentação da API desabilitada em produção
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# =====================================================
# LOGGING CONFIGURATION (PROD PROFILE)
# =====================================================
# Níveis enxutos para reduzir o volume de logs em produção
logging.level.root=WARN
logging.level.com.albertsilva.dev.dscatalog=INFO
logging.level.org.springframework.web=WARN

# SQL e parâmetros das queries desligados (performance e segurança)
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

# =====================================================
# FILE LOGGING
# =====================================================
logging.file.name=logs/asjcatalog-prod.log

# Política de rotação de logs (controle de crescimento)
logging.logback.rollingpolicy.max-file-size=50MB
logging.logback.rollingpolicy.max-history=30
